<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title> Pomodoro Timer</title>
    <link rel="stylesheet" href="style6.css">
    </head>

<body>
   
    <div class="container">
         <div class="timer">
            <h1>Pomodoro Timer </h1>
            <button id="shortBreakBtn"> Short Break </button>
            <button id="longBreakBtn"> Long Break </button>
             
            <div class="time-display">
                <span id="minutes">25</span>:<span id="seconds">00</span>
        
                <div id="rest">
                    <button id="restartBtn"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                        <path d="M20.0092 2V5.13219C20.0092 5.42605 19.6418 5.55908 19.4537 5.33333C17.6226 3.2875 14.9617 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg> </button> 
                </div>
            </div>
            <div class="buttons">
                <button id="add">+</button>
                <button id="less">-</button>
                <button id="startBtn">Start</button>
                <button id="stopBtn">Pause</button>

            </div>
        </div>
    
        <audio id="ringtone" src="ringtone.mp3" preload="auto"></audio>
    <br>
    <!-- To do list code  -->
    <div class="block">
        <h1>To-do list </h1>
        <div class="read">
            <input type="text" placeholder="Enter task to complete" id="inp">
            <button id="task"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#ffffff" fill="none">
    <path d="M21.187 5.99805C20.9854 5.10929 20.6539 4.43424 20.1089 3.88929C18.7177 2.49805 16.4785 2.49805 12.0002 2.49805C7.52184 2.49805 5.28267 2.49805 3.89143 3.88929C2.50018 5.28053 2.50018 7.5197 2.50018 11.998C2.50018 16.4764 2.50018 18.7156 3.89143 20.1068C5.28267 21.498 7.52184 21.498 12.0002 21.498C16.4785 21.498 18.7177 21.498 20.1089 20.1068C20.6539 19.5619 20.9854 18.8868 21.187 17.998" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M21.5 12L17.5 12M17.5 12H13.5M17.5 12V16M17.5 12L17.5 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M9 21.5L9 2.5" stroke="currentColor" stroke-width="1.5" />
    <path d="M2.5 15.5L9 15.5M2.5 8.5L9 8.5" stroke="currentColor" stroke-width="1.5" />
</svg> </button>
        </div>
        <div class="text"> <ul class="task-list" id="task-list" type="none"></ul>
         </div>
         <div class="yn">
            <button id="okk">Done!</button>
            <button id="not_okk">Not Done!!</button>
         </div>
        </div>
    </div>
    
    <script src="script.js"> </script>
 </div>
</body>
</html>
