<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>Pomodoro Timer - Welcome</title>
    <style>
        /* Gradient background for the page */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-135deg, #06e3d4, #065140); /* Teal to light blue gradient */
            font-family: Arial, sans-serif;
            color: #ffffff;
            text-align: center;
        }

        /* Container styling */
        .container {
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            background: rgba(0, 0, 0, 0.3); /* Transparent overlay for better readability */
        }

        /* Heading styling */
        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px;
        }

        /* Button styling */
        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 18px;
            color: #ffffff;
            background: #004d40; /* Deep teal button */
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Modal styling */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #888;
            width: 80%; /* Could be more or less, depending on screen size */
            max-width: 400px;
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: black;
        }

      .modal p{
        color: black;
      }
      .skipBtn{
        color: #004d40;
        background-color: white;
        border: 2px solid #004d40;
      }
        .modal-content input {
            width: calc(100% - 20px);
            padding: 10px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
        }

        .modal-content button {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Your Productivity Partner</h1>
        <p>"Every tick is a step closer to your goals. Let’s make this Pomodoro session count!"</p>

        <button id="startButton">Go for it!</button>

        <!-- Modal for sign up -->
        <div id="signUpModal" class="modal">
            <div class="modal-content">
                <h2>Sign Up</h2>
                <input type="text" id="newUsername" placeholder="Username">
                <input type="password" id="newPassword" placeholder="Password">
                <input type="password" id="confirmPassword" placeholder="Confirm Password">
                <button id="registerUserBtn">Register</button>
                <button id="skipSignUp" class="skipBtn">Skip <i class="fa fa-arrow-right"></i></button>
                <p>Already have an account? <a id="signInLink" href="#">Sign In</a></p>
            </div>
        </div>

        <!-- Modal for sign in -->
        <div id="signInModal" class="modal">
            <div class="modal-content">
                <h2>Sign In</h2>
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button id="loginBtn">Sign In</button>
                <button id="skipSignIn" class="skipBtn">Skip <i class="fa fa-arrow-right"></i></button>
                <p>Don't have an account? <a id="signUpLink" href="#">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script>
        // Temporary storage for user data
        const userDatabase = {};

        // Get the modals and buttons
        const signUpModal = document.getElementById("signUpModal");
        const signInModal = document.getElementById("signInModal");
        const startButton = document.getElementById("startButton");
        const registerUserButton = document.getElementById("registerUserBtn");
        const loginButton = document.getElementById("loginBtn");
        const signInLink = document.getElementById("signInLink");
        const signUpLink = document.getElementById("signUpLink");
        const skipSignUpButton = document.getElementById("skipSignUp");
        const skipSignInButton = document.getElementById("skipSignIn");

        // Function to open the modal
        function openModal(modal) {
            modal.style.display = "block";
        }

        // Function to close the modal
        function closeModal(modal) {
            modal.style.display = "none";
        }

        // Event listeners
        startButton.addEventListener("click", function() {
            openModal(signUpModal);
        });

        registerUserButton.addEventListener("click", function() {
            const newUsername = document.getElementById("newUsername").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword === confirmPassword) {
                if (newUsername && newPassword) {
                    userDatabase[newUsername] = newPassword;
                    alert("Registration successful!");
                    closeModal(signUpModal);
                    openModal(signInModal);
                } else {
                    alert("Please fill in all fields.");
                }
            } else {
                alert("Passwords do not match.");
            }
        });

        loginButton.addEventListener("click", function() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (userDatabase[username] && userDatabase[username] === password) {
                alert("Login successful!");
                closeModal(signInModal);
                window.location.href = "timer.html"; // Redirect to timer page
            } else {
                alert("Invalid username or password.");
            }
        });

        signInLink.addEventListener("click", function() {
            closeModal(signUpModal);
            openModal(signInModal);
        });

        signUpLink.addEventListener("click", function() {
            closeModal(signInModal);
            openModal(signUpModal);
        });

        skipSignUpButton.addEventListener("click", function() {
            closeModal(signUpModal);
            window.location.href = "timer.html";
        });

        skipSignInButton.addEventListener("click", function() {
            closeModal(signInModal);
            window.location.href = "timer.html";
        });

        window.addEventListener("click", function(event) {
            if (event.target == signUpModal) {
                closeModal(signUpModal);
            } else if (event.target == signInModal) {
                closeModal(signInModal);
            }
        });
    </script>
</body>
</html>
