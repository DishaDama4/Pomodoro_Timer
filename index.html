<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Pomodoro Timer</title>
    <!-- <link rel="shortcut icon" href="/favicon.ico"> -->
    <link rel="stylesheet" href="style6.css">
    </head>

<body>
   
    <div class="container">
        <!-- <img src="logo.jpg" width="100" height="100px"> -->
        <div class="timer">
            <h1>Pomodoro Timer </h1>
            <button id="shortBreakBtn"> Short Break </button>
            <button id="longBreakBtn"> Long Break </button>
             
            <div class="time-display">
                <span id="minutes">25</span>:<span id="seconds">00</span>
        
                <div id="rest">
                    <button id="restartBtn"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                        <path d="M20.0092 2V5.13219C20.0092 5.42605 19.6418 5.55908 19.4537 5.33333C17.6226 3.2875 14.9617 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg> </button> 
                </div>
            </div>
            <div class="buttons">
                <button id="add">+</button>
                <button id="less">-</button>
                <button id="startBtn">Start</button>
                <button id="stopBtn">Pause</button>

            </div>
        </div>
    
        <audio id="ringtone" src="ringtone.mp3" preload="auto"></audio>
    <br>
    <!-- To do list code  -->
    <div class="block">
        <h1>To-do list </h1>
        <div class="read">
            <input type="text" placeholder="Enter task to complete" id="inp">
            <button id="task"> + </button>
        </div>
        <div class="text">
         </div>
         <div class="yn">
            <button id="okk">Done!</button>
            <button id="not_okk">Not Done!!</button>
         </div>
        </div>
    </div>
    
    <script src="script.js"> </script>
    <script src="timerworker.js"> </script>
</div>
</body>
</html>
